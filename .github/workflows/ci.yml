name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests apps scripts evals
      - run: black --check src tests apps scripts evals
      - run: mypy src

  unit-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      APP_SECRET_KEY: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      OPENAI_API_KEY: sk-test
      HF_TOKEN: hf_test
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      APP_SECRET_KEY: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      OPENAI_API_KEY: sk-test
      HF_TOKEN: hf_test
      APP_ENV: dev
      EMBEDDING_MODEL: test-hashed-bag
      RERANKER_MODEL: test-passthrough
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m scripts.seed
      # Fixture corpus (conflict pairs, golden references) — required by the
      # clarify/conflict integration tests; mirrors the regression job.
      - run: python -m scripts.seed_fixtures
      - run: pytest tests/integration -v

  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      APP_SECRET_KEY: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      OPENAI_API_KEY: sk-test
      HF_TOKEN: hf_test
      APP_ENV: dev
      EMBEDDING_MODEL: test-hashed-bag
      RERANKER_MODEL: test-passthrough
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m scripts.seed
      - run: pytest tests/security -v

  regression-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      APP_SECRET_KEY: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      OPENAI_API_KEY: sk-test
      HF_TOKEN: hf_test
      APP_ENV: dev
      EMBEDDING_MODEL: test-hashed-bag
      RERANKER_MODEL: test-passthrough
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m scripts.seed
      - run: python -m scripts.seed_fixtures
      - run: pytest tests/regression -v

  eval-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      APP_SECRET_KEY: test-secret-please-change-me-to-64-chars-aaaaaaaaaaaa
      # Real key optional: with no secret configured the runner uses the
      # deterministic mock provider ('sk-test'), recorded in the report.
      # An empty value would otherwise crash the real OpenAI client.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN || 'hf_test' }}
      APP_ENV: dev
      EMBEDDING_MODEL: test-hashed-bag
      RERANKER_MODEL: test-passthrough
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m scripts.seed
      - run: python -m scripts.seed_fixtures
      - run: make eval-smoke
      - name: Quality gate (real metrics; missing metrics FAIL)
        run: |
          python - <<'PY'
          import glob, json, os, sys
          report_files = sorted(glob.glob('evals/reports/eval-*.json'))
          if not report_files:
              print('FAIL: No evaluation report generated.')
              sys.exit(1)
          with open(report_files[-1]) as f:
              data = json.load(f)
          results = data.get('results', [])
          if any(r.get('answer') == '[not implemented]' for r in results):
              print('FAIL: runner produced placeholder answers.')
              sys.exit(1)
          s = (data.get('summary_by_baseline') or {}).get('baseline_6_agentic')
          if s is None:
              print('FAIL: smoke report has no baseline_6_agentic summary.')
              sys.exit(1)
          checks = [
              ('behavior_compliance', '>=', float(os.environ.get('EVAL_BEHAVIOR_MIN', '0.9'))),
              ('pattern_faithfulness', '>=', float(os.environ.get('EVAL_PATTERN_MIN', '0.6'))),
              ('recall_at_k', '>=', float(os.environ.get('EVAL_RECALL_MIN', '0.8'))),
              ('unexpected_failure_rate', '<=', float(os.environ.get('EVAL_UNEXPECTED_FAIL_MAX', '0.05'))),
              ('unauthorized_citations', '==', 0),
          ]
          failed = False
          for metric, op, threshold in checks:
              value = s.get(metric)
              if value is None:
                  print(f'FAIL: {metric} was not measured (None) - gate cannot pass on missing data.')
                  failed = True
                  continue
              ok = {'>=': value >= threshold, '<=': value <= threshold, '==': value == threshold}[op]
              print(f"{'OK' if ok else 'FAIL'}: {metric}={value} (gate {op} {threshold})")
              failed = failed or not ok
          print(f"provider={data.get('provider')} corpus={data.get('corpus_sha256')}")
          sys.exit(1 if failed else 0)
          PY

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, security-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.api -t agentic-rag-api:ci .
      - run: docker build -f docker/Dockerfile.web -t agentic-rag-web:ci .
